name: Dev Build

on:
  push:
    branches:
      - 'develop'
    tags-ignore:
      - v*.*

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 7

      - name: Determine Version
        uses: Stelzi79/action-minver@main-Stelzi79
        id: version
        with:
          auto-increment: patch
          default-pre-release-phase: rc
          tag-prefix: v

      - name: Output Version
        run: |
          echo '### Build Version - ${{ steps.version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          echo '```${{ steps.version.outputs.version }} ```' >> $GITHUB_STEP_SUMMARY

  build-package:
    name: Build Plugin Package
    runs-on: ubuntu-latest
    needs: [calculate-version]
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Compile Sass
        run: cd ./blocks && npm install && npm run sass-compile

      - name: Build React Addon
        run: cd ./gutenberg-addon && npm install && npm run build

      - name: Stamp version + name and assemble plugin zip
        run: bash bin/package-plugin.sh "${{ needs.calculate-version.outputs.version }}"

      # Installable zip for manual "Upload Plugin" installs (WordPress admin).
      - name: Upload installable plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: braftonium-${{ needs.calculate-version.outputs.version }}
          path: braftonium.zip
          if-no-files-found: error
