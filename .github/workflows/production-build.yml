name: Production Build

on:
  release:
    types: [published]

jobs:
  calculate-version:
    name: Calculate Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: benjlevesque/short-sha@v3.0
        id: short-sha
        with:
          length: 7

      - name: Determine Version
        uses: Stelzi79/action-minver@main-Stelzi79
        id: version
        with:
          auto-increment: patch
          default-pre-release-phase: rc
          tag-prefix: v

      - name: Output Version
        run: |
          echo '### Build Version - ${{ steps.version.outputs.version }}' >> $GITHUB_STEP_SUMMARY
          echo '```${{ steps.version.outputs.version }} ```' >> $GITHUB_STEP_SUMMARY

  build-package:
    name: Build Plugin Package
    runs-on: ubuntu-latest
    needs: [calculate-version]
    permissions:
      contents: write
    steps:
      - name: Checkout repo and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Compile Sass
        run: cd ./blocks && npm install && npm run sass-compile

      - name: Build React Addon
        run: cd ./gutenberg-addon && npm install && npm run build

      - name: Stamp version + name and assemble plugin zip
        run: bash bin/package-plugin.sh "${{ needs.calculate-version.outputs.version }}"

      # Attach the official, versioned package to the GitHub Release. This is
      # the asset Composer pulls (see "Install via Composer" in readme.md).
      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: braftonium.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
